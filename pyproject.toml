[project]
name = "incident-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datetime>=6.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
